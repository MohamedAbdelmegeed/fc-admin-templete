# HTTP → HTTPS. الشرط إن التطبيق يشتغل على HTTPS من يوم ١ (docs/00 بند ٢).
server {
    listen 80;
    server_name fc-admin.test *.fc-admin.test localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fc-admin.test *.fc-admin.test localhost;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    # لازم يتطابق مع upload_max_filesize في php.ini (docs/20 بند ٧)
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # بيوصّل لـ Laravel إن الطلب أصله HTTPS — من غيره TrustProxies
        # بيولّد روابط http:// وكل الأصول بتتكسر (docs/14 بند ١)
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        include fastcgi_params;

        fastcgi_read_timeout 120;
    }

    # مفيش تنفيذ PHP جوه مجلدات الرفع (docs/20 بند ٧ قاعدة ٦)
    location ~ ^/storage/.*\.(php|phar|phtml)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
