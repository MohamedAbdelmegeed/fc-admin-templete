; إعدادات الإنتاج. النسخة اللي للتطوير في docker/php/php.ini
memory_limit = 512M
max_execution_time = 120

; لازم يتطابق مع client_max_body_size في nginx.conf (docs/20 بند ٧)
upload_max_filesize = 32M
post_max_size = 32M

date.timezone = Africa/Cairo

; ⚠️ الفرق الحقيقي عن التطوير: validate_timestamps=0 يعني OPcache
; مش هيبص على الملفات تاني خالص. ده أسرع بكتير، ومعناه كمان إن أي
; نشر جديد لازم يبقى حاوية جديدة — تعديل ملف جوه حاوية شغالة
; مش هيبان. وده بالظبط اللي Coolify بيعمله.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; مفيش تسريب معلومات في ردود الأخطاء
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
