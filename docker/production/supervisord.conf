; أربع عمليات في الحاوية: nginx، php-fpm، Horizon، المجدول.
;
; ⚠️ autorestart=true على الكل: لو أي واحدة وقعت، supervisor بيقومها.
; ومن غير stdout_logfile=/dev/stdout مش هتشوف أي لوجّات في Coolify —
; هو بيقرا مخرجات الحاوية بس.

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
command=php /var/www/html/artisan horizon
user=www-data
autostart=true
autorestart=true
priority=20
; Horizon محتاج وقت عشان ينهي الشغلانة اللي في إيده قبل ما يقفل.
stopwaitsecs=3600
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
