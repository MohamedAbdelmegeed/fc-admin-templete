# الإنتاج — HTTP جوه الحاوية بس. الـ TLS بينتهي عند بروكسي Coolify
# (Traefik)، فمفيش شهادات هنا ومفيش تحويل 301 لـ https — التحويل ده
# مسؤولية البروكسي، ولو عملناه هنا كمان بيبقى redirect loop.

server {
    listen 8080 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    charset utf-8;

    # لازم يتطابق مع upload_max_filesize في php.ini (docs/20 بند ٧)
    client_max_body_size 32M;

    # Coolify بيبعت الطلبات جوه شبكته الداخلية؛ الـ IP الحقيقي بييجي
    # في الهيدر، و TrustProxies في Laravel هو اللي بيفكّه.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # فحص الصحة بتاع Coolify — من غير لوجّات عشان ما يغرقش الملف.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        include fastcgi_params;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # الأصول المبنية عليها hash في الاسم، فالكاش الطويل آمن.
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # مفيش تنفيذ PHP جوه مجلدات الرفع (docs/20 بند ٧ قاعدة ٦)
    location ~ ^/storage/.*\.(php|phar|phtml)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
