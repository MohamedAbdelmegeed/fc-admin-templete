services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      # vendor و node_modules على volumes بتاعة Linux مش على الـ bind mount.
      # الكتابة من الحاوية لقرص ويندوز بطيئة جداً مع آلاف الملفات الصغيرة —
      # فك ضغط laravel/framework لوحده عدّى ٣٠٠ ثانية وفشل.
      # التفاصيل في docs/CHANGELOG-DOCS.md. الكود المصدري لسه على الـ bind mount عادي.
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    # منفذ خادم Vite للتطوير (npm run dev) — من غيره HMR شغّال جوه
    # الحاوية بس والمتصفح على ويندوز مايقدرش يوصله. مش لازم في
    # الإنتاج، فمش موجود في docker/production.
    ports: ["5173:5173"]
    depends_on: [postgres, redis]
    environment:
      PHP_IDE_CONFIG: "serverName=fc-admin"
      COMPOSER_PROCESS_TIMEOUT: "1200"

  web:
    image: nginx:1.27-alpine
    # 8080 على الهوست محجوز ببرنامج تاني (AgentService) — اتغيّر لـ 8081.
    # المنفذ ده للتحويل HTTP→HTTPS بس؛ الفعلي هو 8443.
    ports: ["8443:443", "8081:80"]
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/certs:/etc/nginx/certs
    depends_on: [app]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fc_admin
      POSTGRES_USER: fc
      POSTGRES_PASSWORD: secret
    # ⚠️ صور postgres:18+ بتخزّن البيانات في مجلد فرعي باسم الإصدار،
    # فالـ mount لازم يكون على /var/lib/postgresql مش /var/lib/postgresql/data.
    # الشكل القديم بيخلي الحاوية تقع بـ exit 1. (docs/CHANGELOG-DOCS.md)
    volumes: ["pgdata:/var/lib/postgresql"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc -d fc_admin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # يحاكي S3 محلياً — نجرّب S3 من يوم ١ من غير ما ندفع (docs/00 بند ١)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes: ["miniodata:/data"]
    ports: ["9000:9000", "9001:9001"]

  # ينشئ الباكتات مرة واحدة وقت الإقلاع — من غيرها الرفع بيفشل بـ NoSuchBucket
  #
  # ⚠️ باكتين مش واحد. الباكت العام عليه anonymous download، فلو الملفات
  # الخاصة (عقود، مستندات) اتحطّت فيه بتبقى مقروءة للكل بلينك مباشر.
  # الباكت الخاص عمداً من غير أي سياسة anonymous — الوصول بروابط
  # مؤقتة موقّعة بس. (docs/04 بند ٢)
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do sleep 1; done;
      mc mb --ignore-existing local/fc-admin;
      mc anonymous set download local/fc-admin;
      mc mb --ignore-existing local/fc-admin-private;
      mc anonymous set none local/fc-admin-private;
      "

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on: [redis, postgres]
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
  vendor: {}
  node_modules: {}
